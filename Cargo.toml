[package]
name = "slitherss"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
bytes = "1.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
